<main><header><h1>感恩节快乐，感恩有你</h1><p>天天开心 · 把把吃鸡 · offer 多多</p></header><section id="cards" aria-label="祝福卡片组成的爱心"></section><canvas></canvas><footer>感恩相遇，愿你每天都有好事发生</footer><button type="button">再看一次 ♡</button></main>
<script>
const words=['感恩节快乐','感恩有你','天天开心','把把吃鸡','offer 多多','好运连连','心想事成','暴富暴美','烦恼退退','快乐加倍','前程似锦','万事胜意','幸运满格','好事发生'];
const main=document.querySelector('main'),holder=document.querySelector('#cards');
const cards=Array.from({length:52},(_,i)=>{const c=document.createElement('div');c.className='card';const small=document.createElement('small');small.textContent='感恩有你 · 好运相伴';const strong=document.createElement('strong');strong.textContent=words[i%words.length];const em=document.createElement('em');em.textContent='愿你所愿 · 都能实现';c.append(small,strong,em);holder.append(c);return c});
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let start=performance.now(),w,h;
function resize(){w=main.clientWidth;h=main.clientHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();window.addEventListener('resize',resize);
const snow=Array.from({length:65},()=>[Math.random(),Math.random(),10+Math.random()*20,1+Math.random()*1.5]);
function animate(now){const t=(now-start)/1000;cards.forEach((c,i)=>{const q=i/52*Math.PI*2+t*.19,x=16*Math.sin(q)**3,y=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q),z=Math.sin(q+t*.2),grow=1-(1-Math.min(1,Math.max(0,(t-i*.025)/4)))**3,s=(.48+.22*(z+1)/2)*w/480;c.style.transform=`translate(${w/2+x*w*.0225*grow-75}px,${h*.5625-y*h*.01344*grow-44}px) scale(${s})`;c.style.zIndex=String(Math.round((z+1)*100))});ctx.clearRect(0,0,w,h);ctx.fillStyle='#ffffffe0';snow.forEach(([x,y,v,r])=>{ctx.beginPath();ctx.arc((x*w+8*Math.sin(t*.5+y*10)+w)%w,(y*h+t*v)%h,r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(animate)}requestAnimationFrame(animate);document.querySelector('button').onclick=()=>start=performance.now();
</script></html>
